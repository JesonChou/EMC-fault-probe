# ruff 配置：新代码严格检查，历史代码逐步迁移（不阻塞新改动）
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLW", "RUF100", "BLE"]
# 中文项目不适用/不合理的规则：
#   E501     行长度（含 pyuic 生成代码与中文长文本）
#   RUF001/002/003  全角标点检查（中文文本中全角标点是正确用法）
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# ---- 历史遗留代码：风格问题已存在，暂不阻塞 CI，后续单独清理 ----
"experiments/desktop/pyqt6_app/EMC_Fault_Database.py" = ["UP009", "UP004"]
"experiments/desktop/pyqt6_app/EMC_Fault_Database_Test.py" = ["I001", "BLE001", "SIM102", "PLW1510"]
"experiments/ollama/llm_test.py" = ["I001", "BLE001"]
"packages/emc-core-py/src/emc_core/retrieval/emc_dict.py" = ["UP009", "B033"]
"packages/emc-core-py/src/emc_core/retrieval/json_search.py" = ["SIM102", "BLE001", "UP015"]
"experiments/rag/embedding_test.py" = ["I001", "E401", "SIM115"]

# ---- 测试文件：sys.path 调整后的导入属标准测试模式 ----
"packages/emc-core-py/tests/*.py" = ["E402"]
"experiments/desktop/pyqt6_app/tests/*.py" = ["E402", "I001"]
