[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "emc-runtime-local"
version = "0.1.0"
description = "Local agent runtime for EMC fault diagnosis."
requires-python = ">=3.11"
dependencies = [
    "emc-core >= 0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
